name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *" # Run every day at 03:00 UTC
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate light streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: >-
            user=KevinTadashiii&theme=default&hide_border=false&border=E2D6C4&background=FFFDF8&stroke=A3462A&ring=C75B39&fire=C75B39&currStreakNum=2C1810&currStreakLabel=A3462A&sideNums=2C1810&sideLabels=6B5344&dates=9B8172&excludeDaysLabel=9B8172
          path: .github/assets/streak-light.svg

      - name: Generate dark streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: >-
            user=KevinTadashiii&theme=default&hide_border=false&border=3B2D24&background=211A15&stroke=E07A54&ring=D4A843&fire=E07A54&currStreakNum=F5EBDD&currStreakLabel=E07A54&sideNums=F5EBDD&sideLabels=B9A695&dates=8E7564&excludeDaysLabel=8E7564
          path: .github/assets/streak-dark.svg

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/assets/streak-light.svg .github/assets/streak-dark.svg
          git commit -m "Update streak stats" || exit 0
          git push
