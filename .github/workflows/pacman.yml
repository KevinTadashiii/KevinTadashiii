name: Generate Pacman Contribution Grid

on:
  schedule:
    # Run every day at 01:00 (UTC)
    - cron: "0 1 * * *"

  # Allows manual run from the Actions tab
  workflow_dispatch:

  # Run on every push on the main/master branch
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pacman-contribution-graph
        run: npm install -g pacman-contribution-graph

      - name: Generate pacman contribution graph (light theme)
        run: |
          pacman-contribution-graph \
            --game pacman \
            --username KevinTadashiii \
            --platform github \
            --gameTheme github \
            --output dist/pacman-contribution-graph.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pacman contribution graph (dark theme)
        run: |
          pacman-contribution-graph \
            --game pacman \
            --username KevinTadashiii \
            --platform github \
            --gameTheme github-dark \
            --output dist/pacman-contribution-graph-dark.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}