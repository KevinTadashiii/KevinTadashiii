name: Generate contribution graphs

on:
  schedule:
    # Run everyday at midnight (UTC)
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake contribution grid (Platane/snk)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23A3462A&color_dots=%23F0E8DA,%23DCCDB8,%23B7BFA9,%238A9C7C,%2344603F
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23E07A54&color_dots=%23271E19,%233B2D24,%23614A39,%238A6650,%23C75B39
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push all SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
