name: Generate Arcade Contribution Grids

on:
  schedule:
    # Run everyday at midnight (UTC)
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake contribution grid (Platane/snk)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node for pacman
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pacman-contribution-graph
        run: npm install pacman-contribution-graph

      - name: Generate pacman contribution graphs (light & dark)
        run: |
          node --input-type=module <<'EOF'
          import { ArcadeRenderer } from 'pacman-contribution-graph';
          import fs from 'fs';
          import path from 'path';

          const game = 'pacman';
          const themes = ['github', 'github-dark'];
          const username = 'KevinTadashiii';
          const token = process.env.GITHUB_TOKEN;

          fs.mkdirSync('dist', { recursive: true });

          for (const theme of themes) {
            console.log(`Generating ${game} with theme: ${theme}...`);
            const renderer = new ArcadeRenderer({
              game,
              platform: 'github',
              username,
              gameTheme: theme,
              githubSettings: { accessToken: token },
              svgCallback: (svg) => {
                const suffix = theme === 'github' ? '' : '-dark';
                const output = path.join('dist', `${game}-contribution-graph${suffix}.svg`);
                fs.writeFileSync(output, svg);
                console.log(`SVG saved to ${output}`);
              },
              gameOverCallback: () => {
                console.log(`Game over for ${theme}`);
              }
            });
            try {
              await renderer.start();
              console.log(`Completed ${theme}`);
            } catch (error) {
              console.error(`Error generating ${theme}:`, error);
              process.exit(1);
            }
          }
          console.log('All done!');
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push all SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}